version: "3.8"

services:
  facilityos-frontend:
    container_name: facilityos-frontend-prod
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_API_TIMEOUT=30000
        - VITE_ENABLE_LOGGING=false
        - VITE_ENABLE_MOCK=false
        - VITE_APP_ENV=production
    environment:
      - BACKEND_PRIVATE_URL=http://facilityos-api-prod:8080
    ports:
      - "3000:80"
    restart: always
    networks:
      - facilityos-network

networks:
  facilityos-network:
    external: true
