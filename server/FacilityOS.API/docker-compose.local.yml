    ports:
      - "5000:8080" 
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal;Database=FacilityOSDB;User Id=sa;Password=Darmixista5;TrustServerCertificate=True;
      
      - Jwt__Key=MySuperSecretKey0q2374q287asdfjasdf
      - Jwt__Issuer=FacilityOSAPI
